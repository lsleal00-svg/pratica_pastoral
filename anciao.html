<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2e6b">
  <meta name="robots" content="noindex">
  <title>Comprovação de prática pastoral</title>
  <link rel="icon" href="assets/icone-192.png">
  <link rel="stylesheet" href="css/estilo.css">
  <style>
    .pag-anciao { max-width: 560px; margin: 0 auto; padding: 18px 16px 50px; }
    .itens-anciao { list-style: none; padding: 0; margin: 10px 0 0; }
    .itens-anciao li { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--borda); }
    .itens-anciao li:last-child { border-bottom: 0; }
    .itens-anciao .ok { color: var(--verde); font-weight: 800; }
    .botoes-anciao { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .botoes-anciao .btn { min-height: 52px; font-size: 16px; }
    .btn-confirmar { background: var(--verde); }
    .btn-confirmar:hover { background: #17834a; }
  </style>
</head>
<body>
  <header class="topo"><div class="titulo">Prática Pastoral<small>Comprovação · Teologia FAAMA</small></div></header>
  <main class="pag-anciao" id="conteudo"><div class="carregando">Carregando…</div></main>
  <script type="module" src="js/anciao.js"></script>
</body>
</html>
